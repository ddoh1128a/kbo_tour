<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBO Tour</title>

    <style>
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#F6EEDC;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            text-align:center;
        }

        h1{
            font-size:48px;
            color:#0B2C5F;
            margin-bottom:10px;
        }

        p{
            font-size:20px;
            color:#444;
        }

        .ball{
            font-size:60px;
            animation:spin 1.2s linear infinite;
            display:block;
            margin-bottom:25px;
        }

        @keyframes spin{
            from{transform:rotate(0deg);}
            to{transform:rotate(360deg);}
        }
    </style>

    <script>

        setTimeout(function(){

            window.location.href="https://docs.google.com/forms/d/e/1FAIpQLScL6c_oudZOhW0ZJl4D3s8KX2VvBotfB0YMF6uaBY0AX-VtTA/viewform?usp=header";

        },1000);

    </script>

</head>

<body>

<div class="box">

<span class="ball">⚾</span>

<h1>KBO TOUR</h1>

<p>Redirecting to reservation...</p>

</div>

</body>

</html>
